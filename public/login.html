<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in / Sign up</title>
</head>
<body>

<div id="auth">

  <!-- Step: email + password -->
  <div id="step-credentials">
    <p>
      <button type="button" id="mode-login">Log in</button>
      <button type="button" id="mode-signup">Sign up</button>
    </p>
    <form id="credentials-form">
      <p><input type="email" id="email" placeholder="name@baltijosgimnazija.lt" autocomplete="email" required></p>
      <p><input type="password" id="password" placeholder="Password" autocomplete="current-password" minlength="10" maxlength="128" required></p>
      <p><button type="submit" id="continue">Continue</button></p>
    </form>
    <p id="forgot-row"><button type="button" id="forgot">Forgot password?</button></p>
  </div>

  <!-- Step: email verification code -->
  <form id="code-form" hidden>
    <p>We sent a 6-digit code to your email.</p>
    <p><input type="text" id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="123456" autocomplete="one-time-code" required></p>
    <p>
      <button type="submit">Continue</button>
      <button type="button" id="resend">Resend code</button>
    </p>
  </form>

  <!-- Step: password reset, request code -->
  <form id="forgot-form" hidden>
    <p>Enter your email and we will send you a code to reset your password.</p>
    <p><input type="email" id="forgot-email" placeholder="name@baltijosgimnazija.lt" autocomplete="email" required></p>
    <p>
      <button type="submit">Continue</button>
      <button type="button" class="back">Back</button>
    </p>
  </form>

  <!-- Step: password reset, code + new password -->
  <form id="reset-form" hidden>
    <p>Enter the 6-digit code we emailed you and choose a new password.</p>
    <p><input type="text" id="reset-code" inputmode="numeric" pattern="\d{6}" maxlength="6" placeholder="123456" autocomplete="one-time-code" required></p>
    <p><input type="password" id="new-password" placeholder="New password" autocomplete="new-password" minlength="10" maxlength="128" required></p>
    <p>
      <button type="submit">Continue</button>
      <button type="button" id="reset-resend">Resend code</button>
      <button type="button" class="back">Back</button>
    </p>
  </form>

  <p id="message" role="alert"></p>
</div>

<div id="done" hidden>
  <p>Logged in as <span id="who"></span></p>
  <p><a href="/">Continue to the app</a></p>
  <p><button type="button" id="logout">Log out</button></p>
</div>

<script src="/auth.js"></script>
</body>
</html>
